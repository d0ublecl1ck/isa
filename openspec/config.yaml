schema: spec-driven

# 项目上下文（可选）
# 创建产物时会展示给 AI。
# 可添加你的技术栈、约定、风格指南、领域知识等。
# 示例：
#   context: |
#     技术栈：TypeScript, React, Node.js
#     我们使用 Conventional Commits
#     领域：电商平台

# 各类产物的规则（可选）
# 为特定产物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - proposal 控制在 500 词以内
#       - 始终包含 "Non-goals" 章节
#     tasks:
#       - 将任务拆分为不超过 2 小时的粒度

# 各类操作的指导（可选）
# 为 apply 与 archive 的执行方式添加建议性指导。
# 此项独立于上方的产物规则。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试摘要保持简洁
#     archive:
#       guidance:
#         - 收尾前总结归档结果
